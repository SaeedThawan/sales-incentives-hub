      minGroupsRequired: 7,
      collectionTiers: [
        { minPct: 0, maxPct: 19.99, rate: 0.0000 },
        { minPct: 20, maxPct: 29.99, rate: 0.0025 },
        { minPct: 30, maxPct: 39.99, rate: 0.0050 },
        { minPct: 40, maxPct: 59.99, rate: 0.0075 },
        { minPct: 60, maxPct: 1000, rate: 0.0100 }

    function App() {
      const [currentUser, setCurrentUser] = useState({ userId: 1, username: 'admin', fullName: 'المدير العام', role: 'manager' });
      const [repsData, setRepsData] = useState(INITIAL_REPS_DATA);
      const [generalRules, setGeneralRules] = useState(INITIAL_GENERAL_RULES);
      const [groupRules, setGroupRules] = useState(INITIAL_GROUPS_RULES);
      const [activeTab, setActiveTab] = useState('summary');
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedRep, setSelectedRep] = useState(null);
      const [monthStatus, setMonthStatus] = useState('open');
      const [showAuditModal, setShowAuditModal] = useState(false);
      const [notification, setNotification] = useState('');
      const [syncLoading, setSyncLoading] = useState(false);
      const [expandedGroupIdx, setExpandedGroupIdx] = useState(null);

      const showToast = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(''), 3500);
      };

      const formatNum = (num) => Math.round(num || 0).toLocaleString('en-US');

      const getCollectionCommissionRate = (collPct) => {
        const tier = generalRules.collectionTiers.find(t => collPct >= t.minPct && collPct <= t.maxPct);
        return tier ? tier.rate : 0;
      };

      const processedReps = useMemo(() => {
        return repsData.map(rep => {
          const genTarget = rep.generalTarget || 0;
          const genSales = rep.generalSales || 0;
          const genPct = genTarget > 0 ? (genSales / genTarget) * 100 : 0;
          const requiredGenSales = genTarget * (generalRules.generalThresholdPct / 100);
          const remainingGenSales = Math.max(0, requiredGenSales - genSales);
          const meetsGeneralRule = genPct >= generalRules.generalThresholdPct;

          let qualifiedGroupsCount = 0;
          let potentialGroupCommSum = 0;

          const detailedGroups = (rep.groups || []).map((grp, gIdx) => {
            const rule = groupRules[gIdx] || { thresholdPct: 70, commType: 'fixed', commValue: 250, name: `مجموعة ${gIdx+1}` };
            const grpTarget = grp.target || 0;
            const grpSales = grp.sales || 0;
            const grpPct = grpTarget > 0 ? (grpSales / grpTarget) * 100 : 0;
            const isQualified = grpTarget > 0 && grpPct >= rule.thresholdPct;

            if (isQualified) qualifiedGroupsCount++;

            const effectiveCommVal = grp.customComm !== undefined ? grp.customComm : rule.commValue;
            let potentialComm = 0;
            if (isQualified) {
              potentialComm = rule.commType === 'fixed' ? effectiveCommVal : Math.max(0, grpSales) * (effectiveCommVal / 100);
            }
            potentialGroupCommSum += potentialComm;

            return {
              ...grp,
              name: rule.name,
              thresholdPct: rule.thresholdPct,
              effectiveCommVal,
              grpPct,
              isQualified,
              potentialComm
            };
          });

          const meetsMinGroupsRule = qualifiedGroupsCount >= generalRules.minGroupsRequired;
          const isFullyEligibleForGroupComm = meetsGeneralRule && meetsMinGroupsRule;
          const totalGroupCommissionEarned = isFullyEligibleForGroupComm ? potentialGroupCommSum : 0;

          const baseGenCommVal = Number(generalRules.generalTargetCommValue) || 0;
          const generalTargetCommEarned = (isFullyEligibleForGroupComm && baseGenCommVal > 0) ? baseGenCommVal : 0;

          const debt = rep.debt || 0;
          const coll = rep.collection || 0;
          const collPct = debt > 0 ? (coll / debt) * 100 : 0;
          const collCommRate = getCollectionCommissionRate(collPct);
          const collectionCommission = coll * collCommRate;

          const grandTotalCommission = collectionCommission + totalGroupCommissionEarned + generalTargetCommEarned;

          let groupCommStatusMsg = '';
          if (!meetsGeneralRule) {
            groupCommStatusMsg = `محجوبة (لم يحقق الهدف العام ${generalRules.generalThresholdPct}%)`;
          } else if (!meetsMinGroupsRule) {
            groupCommStatusMsg = `محجوبة (حقق ${qualifiedGroupsCount} من أصل ${generalRules.minGroupsRequired} مجموعات)`;
          } else {
            groupCommStatusMsg = `مستحقة (${qualifiedGroupsCount} مجموعات محققة)`;
          }

          return {
            ...rep,
            genPct,
            requiredGenSales,
            remainingGenSales,
            meetsGeneralRule,
            meetsMinGroupsRule,
            isFullyEligibleForGroupComm,
            groupCommStatusMsg,
            detailedGroups,
            qualifiedGroupsCount,
            collPct,
            collCommRate,
            collectionCommission,
            totalGroupCommissionEarned,
            generalTargetCommEarned,
            grandTotalCommission
          };
        });
      }, [repsData, generalRules, groupRules]);

      const companyTotals = useMemo(() => {
        let genTarget = 0, genSales = 0, debt = 0, collection = 0;
        let collComm = 0, groupCommSum = 0, genTargetCommSum = 0, grandComm = 0;
        let qualifiedRepsCount = 0;

        processedReps.forEach(r => {
          genTarget += r.generalTarget || 0;
          genSales += r.generalSales || 0;
          debt += r.debt || 0;
          collection += r.collection || 0;
          collComm += r.collectionCommission || 0;
          groupCommSum += r.totalGroupCommissionEarned || 0;
          genTargetCommSum += r.generalTargetCommEarned || 0;
          grandComm += r.grandTotalCommission || 0;
          if (r.isFullyEligibleForGroupComm) qualifiedRepsCount++;
        });

        const overallGenPct = genTarget > 0 ? (genSales / genTarget) * 100 : 0;
        return {
          genTarget, genSales, overallGenPct, debt, collection,
          collComm, groupCommSum, genTargetCommSum, grandComm, qualifiedRepsCount, totalReps: processedReps.length
        };
      }, [processedReps]);

      const filteredReps = useMemo(() => {
        return processedReps.filter(r => (r.name && r.name.includes(searchTerm)) || (r.id && r.id.toString().includes(searchTerm)));
      }, [processedReps, searchTerm]);

      return (

                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <h1 className="text-xl font-black text-white">نظام إدارة الأهداف والعمولات الشامل</h1>
                      <button
                        onClick={() => setShowAuditModal(true)}

                        <span>{monthStatus === 'approved' ? 'معتمد ومقفل 🔒' : 'قيد التخطيط والمراجعة ✍️'}</span>

                        onClick={() => { setMonthStatus('open'); showToast('تم فتح التعديل مجدداً من قبل المدير العام'); }}

                      </button>

                        onClick={() => { setMonthStatus('approved'); showToast('تم اعتماد وترحيل الشهر وإقفاله بنجاح 🔒'); }}

                        <span>اعتماد وترحيل النهائي 🔒</span>

              {/* Navigation Tabs */}
              <div className="flex space-x-2 space-x-reverse mt-4 border-t border-slate-700/60 pt-3 overflow-x-auto">
                <button
                  onClick={() => setActiveTab('summary')}
                  className={`px-4 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all flex items-center gap-2 shrink-0 ${
                    activeTab === 'summary' ? 'bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/20' : 'bg-slate-900 text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  <i className="fa-solid fa-table-list"></i> خلاصة المندوبين والعمولات
                </button>

                <button
                  onClick={() => setActiveTab('config')}
                  className={`px-4 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all flex items-center gap-2 shrink-0 ${
                    activeTab === 'config' ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20' : 'bg-slate-900 text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  <i className="fa-solid fa-sliders"></i> إعدادات شروط وعمولات الـ 14 والتحصيل
                </button>

                <button
                  onClick={() => setActiveTab('proposals')}
                  className={`px-4 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all flex items-center gap-2 shrink-0 ${
                    activeTab === 'proposals' ? 'bg-purple-600 text-white shadow-lg shadow-purple-600/30' : 'bg-slate-900 text-purple-300 hover:bg-slate-700 border border-purple-500/30'
                  }`}
                >
                  <i className="fa-solid fa-kitchen-set text-amber-400"></i> المطبخ الرئيسي لتخطيط العمولات والأهداف 🧠
                </button>
              </div>

            </div>
          </header>

          {/* Toast Notification */}
          {notification && (
            <div className="fixed bottom-5 left-5 z-50 bg-emerald-500 text-slate-950 px-4 py-3 rounded-xl shadow-2xl font-bold flex items-center gap-2 animate-bounce">
              <i className="fa-solid fa-circle-check text-lg"></i>
              <span>{notification}</span>
            </div>
          )}

          {/* Main Container */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">

            {/* بطاقات المؤشرات العامة */}
            <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3 mb-6">
              <div className="bg-slate-800 border border-slate-700 p-3.5 rounded-2xl shadow-sm">
                <span className="text-slate-400 text-xs block font-semibold mb-1">المبيعات العامة</span>
                <span className="text-base font-extrabold text-white font-mono">{formatNum(companyTotals.genSales)}</span>
                <span className="text-[11px] text-slate-400 block mt-0.5 font-mono">هدف {formatNum(companyTotals.genTarget)}</span>
              </div>

              <div className="bg-slate-800 border border-slate-700 p-3.5 rounded-2xl shadow-sm">
                <span className="text-slate-400 text-xs block font-semibold mb-1">النسبة العامة</span>
                <span className={`text-base font-extrabold font-mono ${companyTotals.overallGenPct >= generalRules.generalThresholdPct ? 'text-emerald-400' : 'text-amber-400'}`}>
                  {companyTotals.overallGenPct.toFixed(1)}%
                </span>
                <span className="text-[11px] text-slate-400 block mt-0.5">شرط الهدف: {generalRules.generalThresholdPct}%</span>
              </div>

              <div className="bg-slate-800 border border-slate-700 p-3.5 rounded-2xl shadow-sm">
                <span className="text-slate-400 text-xs block font-semibold mb-1">إجمالي عمولات المجموعات</span>
                <span className="text-base font-extrabold text-teal-300 font-mono">{formatNum(companyTotals.groupCommSum)} <span className="text-xs">ر.س</span></span>
                <span className="text-[11px] text-slate-400 block mt-0.5">للمستحقين</span>
              </div>

              <div className="bg-slate-800 border border-slate-700 p-3.5 rounded-2xl shadow-sm">
                <span className="text-slate-400 text-xs block font-semibold mb-1">عمولات الهدف العام</span>
                <span className="text-base font-extrabold text-amber-300 font-mono">{formatNum(companyTotals.genTargetCommSum)} <span className="text-xs">ر.س</span></span>
                <span className="text-[11px] text-slate-400 block mt-0.5">مكافأة الهدف</span>
              </div>

              <div className="bg-slate-800 border border-slate-700 p-3.5 rounded-2xl shadow-sm">
                <span className="text-slate-400 text-xs block font-semibold mb-1">عمولات التحصيل الإجمالية</span>
                <span className="text-base font-extrabold text-blue-300 font-mono">{formatNum(companyTotals.collComm)} <span className="text-xs">ر.س</span></span>
                <span className="text-[11px] text-slate-400 block mt-0.5">حسب الشرائح</span>
              </div>

              <div className="bg-slate-800 border border-emerald-500/30 bg-emerald-950/20 p-3.5 rounded-2xl shadow-sm">
                <span className="text-emerald-300 text-xs block font-bold mb-1">إجمالي كافة العمولات</span>
                <span className="text-lg font-black text-emerald-400 font-mono">{formatNum(companyTotals.grandComm)} <span className="text-[11px] font-normal text-slate-300">ر.س</span></span>
                <span className="text-[10px] text-slate-400 block mt-0.5">مجموعات + تحصيل + هدف</span>
              </div>
            </div>

            {/* Tab 1: خلاصة المندوبين */}
            {activeTab === 'summary' && (
              <div className="space-y-4">
                <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex flex-col md:flex-row md:items-center justify-between gap-4 shadow-md">
                  <div className="relative flex-1 max-w-md">
                    <i className="fa-solid fa-magnifying-glass absolute right-3.5 top-3 text-slate-400 text-sm"></i>
                    <input
                      type="text"
                      placeholder="ابحث باسم المندوب أو الرقم..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl pr-10 pl-4 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                </div>

                <div className="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-2xl">
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs text-right text-slate-200">
                      <thead className="bg-slate-900 text-slate-300 uppercase text-[11px] font-extrabold border-b border-slate-700">
                        <tr>
                          <th className="py-3.5 px-3">#</th>
                          <th className="py-3.5 px-3">اسم المندوب</th>
                          <th className="py-3.5 px-3">الهدف العام</th>
                          <th className="py-3.5 px-3">المبيعات العامة</th>
                          <th className="py-3.5 px-3">النسبة</th>
                          <th className="py-3.5 px-3 text-amber-300">عمولة الهدف</th>
                          <th className="py-3.5 px-3 text-center">المجموعات</th>
                          <th className="py-3.5 px-3 text-center">الحالة</th>
                          <th className="py-3.5 px-3">التحصيل</th>
                          <th className="py-3.5 px-3 text-blue-300">عمولة التحصيل</th>
                          <th className="py-3.5 px-3 text-teal-300">عمولات المجموعات</th>
                          <th className="py-3.5 px-3 text-emerald-300 bg-emerald-950/30 font-black">إجمالي المستحق</th>
                          <th className="py-3.5 px-3 text-center">تفاصيل</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-700/60 font-medium font-mono">
                        {filteredReps.map((rep) => (
                          <tr key={rep.id} className="hover:bg-slate-700/40 transition-colors">
                            <td className="py-3 px-3 text-slate-400">{rep.id}</td>
                            <td className="py-3 px-3 font-sans font-bold text-white">{rep.name}</td>
                            <td className="py-3 px-3">{formatNum(rep.generalTarget)}</td>
                            <td className="py-3 px-3 font-bold text-white">{formatNum(rep.generalSales)}</td>
                            <td className="py-3 px-3">
                              <span className={`font-bold ${rep.meetsGeneralRule ? 'text-emerald-400' : 'text-rose-400'}`}>
                                {rep.genPct.toFixed(1)}%
                              </span>
                            </td>
                            <td className="py-3 px-3 text-amber-300 font-bold">{formatNum(rep.generalTargetCommEarned)}</td>
                            <td className="py-3 px-3 text-center">
                              <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                rep.meetsMinGroupsRule ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-950 text-rose-300'
                              }`}>
                                {rep.qualifiedGroupsCount} / 14
                              </span>
                            </td>
                            <td className="py-3 px-3 text-center font-sans">
                              {rep.isFullyEligibleForGroupComm ? (
                                <span className="bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded text-[10px] font-bold">مستحق</span>
                              ) : (
                                <span className="bg-rose-950/60 text-rose-300 px-2 py-0.5 rounded text-[10px]">محجوبة</span>
                              )}
                            </td>
                            <td className="py-3 px-3">{formatNum(rep.collection)}</td>
                            <td className="py-3 px-3 text-blue-300 font-bold">{formatNum(rep.collectionCommission)}</td>
                            <td className="py-3 px-3 text-teal-300 font-bold">{formatNum(rep.totalGroupCommissionEarned)}</td>
                            <td className="py-3 px-3 bg-emerald-950/30 font-black text-emerald-400 text-sm">
                              {formatNum(rep.grandTotalCommission)} ر.س
                            </td>
                            <td className="py-3 px-3 text-center">
                              <button
                                onClick={() => setSelectedRep(rep)}
                                className="bg-slate-700 hover:bg-emerald-600 hover:text-slate-950 text-slate-200 px-3 py-1 rounded-lg text-xs font-bold transition-all"
                              >
                                التفاصيل
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* Tab 2: إعدادات الشروط */}
            {activeTab === 'config' && (
              <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-6">
                <h2 className="text-base font-bold text-white flex items-center gap-2">
                  <i className="fa-solid fa-sliders text-amber-400"></i> إعدادات شروط التأهل العامة
                </h2>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-700">
                    <label className="text-xs font-bold text-slate-300 block mb-1">نسبة شرط الهدف العام (%)</label>
                    <input
                      type="number"
                      value={generalRules.generalThresholdPct}
                      onChange={(e) => setGeneralRules({ ...generalRules, generalThresholdPct: parseFloat(e.target.value) || 0 })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 font-bold text-emerald-400 text-center"
                    />
                  </div>

                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-700">
                    <label className="text-xs font-bold text-slate-300 block mb-1">عمولة الهدف العام (ر.س)</label>
                    <input
                      type="number"
                      value={generalRules.generalTargetCommValue}
                      onChange={(e) => setGeneralRules({ ...generalRules, generalTargetCommValue: parseFloat(e.target.value) || 0 })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 font-bold text-amber-300 text-center font-mono"
                    />
                  </div>

                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-700">
                    <label className="text-xs font-bold text-slate-300 block mb-1">أدنى عدد مجموعات مطلوبة</label>
                    <input
                      type="number"
                      value={generalRules.minGroupsRequired}
                      onChange={(e) => setGeneralRules({ ...generalRules, minGroupsRequired: parseInt(e.target.value) || 0 })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 font-bold text-teal-300 text-center"
                    />
                  </div>
                </div>
              </div>
            )}

            {/* Tab 3: مطبخ التخطيط */}
            {activeTab === 'proposals' && (
              <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
                <div className="flex items-center justify-between border-b border-slate-700 pb-3">
                  <div>
                    <h2 className="text-base font-bold text-white flex items-center gap-2">
                      <i className="fa-solid fa-kitchen-set text-purple-400"></i> مطبخ تخطيط وتعديل أهداف المجموعات الـ 14
                    </h2>
                    <p className="text-xs text-slate-400 mt-0.5">تعديل الشروط والعمولات الخاصة لكل مجموعة</p>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {groupRules.map((grp, idx) => (
                    <div key={idx} className="bg-slate-900 border border-slate-700/80 p-4 rounded-xl space-y-3">
                      <div className="flex justify-between items-center">
                        <span className="font-bold text-sm text-white">{grp.name}</span>
                        <span className="text-[10px] text-teal-300 bg-teal-950/60 px-2 py-0.5 rounded">مجموعة {idx+1}</span>
                      </div>

                      <div className="grid grid-cols-2 gap-2 text-xs">
                        <div>
                          <label className="text-[10px] text-slate-400 block mb-1">شرط التأهل (%)</label>
                          <input
                            type="number"
                            value={grp.thresholdPct}
                            onChange={(e) => {
                              const updated = [...groupRules];
                              updated[idx].thresholdPct = parseFloat(e.target.value) || 0;
                              setGroupRules(updated);
                            }}
                            className="w-full bg-slate-950 border border-slate-700 rounded p-1.5 text-center font-bold text-teal-300"
                          />
                        </div>
                        <div>
                          <label className="text-[10px] text-slate-400 block mb-1">قيمة العمولة (ر.س)</label>
                          <input
                            type="number"
                            value={grp.commValue}
                            onChange={(e) => {
                              const updated = [...groupRules];
                              updated[idx].commValue = parseFloat(e.target.value) || 0;
                              setGroupRules(updated);
                            }}
                            className="w-full bg-slate-950 border border-slate-700 rounded p-1.5 text-center font-bold text-emerald-400"
                          />
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* نافذة تفاصيل المندوب */}
          {selectedRep && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-800 border border-slate-700 rounded-3xl max-w-4xl w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                  <h3 className="text-base font-bold text-white flex items-center gap-2">
                    <i className="fa-solid fa-user-check text-emerald-400"></i> تفاصيل أداء المندوب: {selectedRep.name}
                  </h3>
                  <button onClick={() => setSelectedRep(null)} className="text-slate-400 hover:text-white">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <div className="overflow-x-auto max-h-80 overflow-y-auto border border-slate-700 rounded-xl">
                  <table className="w-full text-xs text-right text-slate-200">
                    <thead className="bg-slate-900 text-slate-400 sticky top-0">
                      <tr>
                        <th className="p-2.5">المجموعة</th>
                        <th className="p-2.5">الهدف</th>
                        <th className="p-2.5">المبيعات</th>
                        <th className="p-2.5">النسبة</th>
                        <th className="p-2.5 text-center">الحالة</th>
                        <th className="p-2.5">العمولة</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-700 font-mono">
                      {(selectedRep.detailedGroups || []).map((grp, idx) => (
                        <tr key={idx} className={grp.isQualified ? 'bg-emerald-950/20' : ''}>
                          <td className="p-2.5 font-sans font-bold text-white">{grp.name}</td>
                          <td className="p-2.5">{formatNum(grp.target)}</td>
                          <td className="p-2.5 font-bold text-emerald-400">{formatNum(grp.sales)}</td>
                          <td className="p-2.5">{grp.grpPct.toFixed(1)}%</td>
                          <td className="p-2.5 text-center font-sans">
                            {grp.isQualified ? <span className="text-emerald-400 font-bold">محققة</span> : <span className="text-slate-500">غير محققة</span>}
                          </td>
                          <td className="p-2.5 text-teal-300 font-bold">{formatNum(selectedRep.isFullyEligibleForGroupComm ? grp.potentialComm : 0)} ر.س</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div className="flex justify-end">
                  <button
                    onClick={() => setSelectedRep(null)}
                    className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-6 py-2 rounded-xl text-xs"
                  >
                    إغلاق
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* نافذة التراكر */}
          {showAuditModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    <i className="fa-solid fa-fingerprint text-emerald-400"></i> سجل التتبع والاعتماد (Tracker)
                  </h3>
                  <button onClick={() => setShowAuditModal(false)} className="text-slate-400 hover:text-white">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div className="bg-slate-900 p-3 rounded-xl border border-slate-700">
                    <span className="text-slate-400 block mb-1">حالة الشهر المالي:</span>
                    <span className="font-bold text-emerald-400 font-mono text-sm">
                      {monthStatus === 'approved' ? 'معتمد ومقفل نهائياً 🔒' : 'قيد المراجعة والتعديل ✍️'}
                    </span>
                  </div>

                  <div className="bg-slate-900 p-3 rounded-xl border border-slate-700 space-y-2">
                    <div className="flex justify-between">
                      <span className="text-slate-400">آخر تعديل بواسطة:</span>
                      <span className="font-bold text-white">{currentUser.fullName}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">تاريخ التحديث:</span>
                      <span className="font-mono text-slate-300">26-08-2026</span>
                    </div>
                  </div>
                </div>

                <div className="flex justify-end">
                  <button
                    onClick={() => setShowAuditModal(false)}
                    className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-5 py-2 rounded-xl text-xs"
                  >
                    إغلاق
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
